<main class="pagina-login">
  <section class="cartao-login">
    <h1>Entrar como administrador</h1>
    <p>Use seus dados de administrador para continuar.</p>

    <form (ngSubmit)="entrar()">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="admin@voltix.com"
        [(ngModel)]="email"
        required
      />

      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        placeholder="Digite sua senha"
        [(ngModel)]="senha"
        required
      />

      <button type="submit" [disabled]="carregando">
        {{ carregando ? 'Verificando...' : 'Entrar' }}
      </button>

      <p>{{ mensagem }}</p>
    </form>
  </section>
</main>
